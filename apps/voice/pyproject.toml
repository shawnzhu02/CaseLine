[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caseline-voice"
version = "0.1.0"
description = "CaseLine Guava voice agent (the only place that imports the Guava SDK for call handling)"
requires-python = ">=3.12"
dependencies = [
  # Pinned to the version generated by `guava create` (Guava CLI 0.45.0) on 2026-09-26.
  "guava-sdk==0.45.0",
  "typing_extensions",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["caseline_voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
