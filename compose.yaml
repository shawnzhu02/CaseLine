# Local development services. Passwords are development-only; production uses managed secrets.
# Redis is intentionally absent: the notification queue is a Postgres outbox (docs/decisions/0001-architecture.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: caseline
      POSTGRES_USER: caseline
      POSTGRES_PASSWORD: caseline_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseline -d caseline"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - caseline_postgres:/var/lib/postgresql/data

volumes:
  caseline_postgres:
